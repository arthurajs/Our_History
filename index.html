<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="author" content="Arthur J. Steingart">
<title>Their Lives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF0EC;--surface:#F8F9F6;--ink:#16252A;--muted:#55646A;--rule:#C9D0CC;--accent:#1F4E79;--bad:#8A2A1B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0F171A;--surface:#162226;--ink:#E4EBEA;--muted:#9BA9AD;--rule:#2A3A40;--accent:#86B7E8;--bad:#F0907A;color-scheme:dark}}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box}
.box{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:32px 28px}
h1{font-family:"Literata",Georgia,serif;font-weight:600;font-size:2.2rem;margin:0 0 6px;letter-spacing:-.01em}
p{margin:0 0 20px;color:var(--muted);line-height:1.5}
label{display:block;font-size:.85rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
input[type=password]{width:100%;box-sizing:border-box;font:inherit;font-size:1.1rem;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
input[type=password]:focus{outline:3px solid var(--accent);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 20px;font-size:.95rem;color:var(--muted)}
button{width:100%;font:inherit;font-weight:700;font-size:1.05rem;padding:12px;border:0;border-radius:8px;background:var(--ink);color:var(--paper);cursor:pointer;min-height:48px}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.5em;margin:14px 0 0;font-size:.95rem}
.msg.bad{color:var(--bad)}
.foot{margin-top:22px;font-size:.8rem;color:var(--muted)}

/* Shared family-study identity. Authentication is unchanged. */
:root{--paper:#f7f3e9;--surface:#fffcf5;--ink:#203d32;--muted:#5b665c;--rule:#d7d9c9;--accent:#967239;--bad:#8a2a1b;color-scheme:light}
body{background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.box{max-width:480px;padding:44px 38px;border-radius:3px;border-top:4px solid #203d32;box-shadow:0 12px 45px #183b3009}
h1{font:400 52px/1.1 Georgia,serif;letter-spacing:-.04em;margin-bottom:20px}
p{font-size:16px;line-height:1.7}input[type=password],button{border-radius:3px}label{font-size:11px;letter-spacing:.12em}.foot{font-size:12px;line-height:1.6}
@media(max-width:540px){.box{padding:32px 25px}h1{font-size:46px}}
</style>
</head>
<body>
<main class="box">
  <h1>Their Lives</h1>
  <p>The Smilovic and Spitz families, one life at a time. This family record is private; please type the password Arthur gave you.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <div class="row"><input id="keep" type="checkbox"><label for="keep" style="all:unset;cursor:pointer">Remember me on this device</label></div>
    <button id="go" type="submit">Open</button>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </form>
  <div class="foot">Made by Arthur J. Steingart from the family's recorded testimony and records.</div>
</main>
<script>
(function(){
"use strict";
const SALT=hex('12a81ea82d90580da73d9537601eb10a'),ITER=310000;
const $=id=>document.getElementById(id);
function hex(h){const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
function toHex(b){return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function store(k,v){try{if(v==null){sessionStorage.removeItem(k);localStorage.removeItem(k);}else{sessionStorage.setItem(k,v);if($('keep').checked)localStorage.setItem(k,v);}}catch(e){}}
function stored(k){try{return sessionStorage.getItem(k)||localStorage.getItem(k);}catch(e){return null;}}
function say(t,bad){$('msg').textContent=t;$('msg').className='msg'+(bad?' bad':'');}
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',salt:SALT,iterations:ITER,hash:'SHA-256'},base,256);}
async function unlock(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const r=await fetch('app.enc',{cache:'no-cache'});if(!r.ok)throw new Error('The page could not be loaded ('+r.status+').');
  const buf=new Uint8Array(await r.arrayBuffer());
  let html;try{html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12)));}
  catch(e){const err=new Error('That password did not work. Please try again.');err.pw=true;throw err;}
  if(!('serviceWorker' in navigator))throw new Error('This browser cannot open the pictures and voices. Please use Chrome, Safari, Edge or Firefox.');
  say('Opening…');
  const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
  const sw=reg.active||navigator.serviceWorker.controller;
  await new Promise((ok,no)=>{const ch=new MessageChannel();ch.port1.onmessage=()=>ok();setTimeout(()=>no(new Error('The page did not start. Please reload.')),15000);sw.postMessage({type:'key',raw},[ch.port2]);});
  if(!navigator.serviceWorker.controller)await new Promise(ok=>{navigator.serviceWorker.addEventListener('controllerchange',ok,{once:true});setTimeout(ok,3000);});
  if(!navigator.serviceWorker.controller){location.reload();return;}
  document.open();document.write(html);document.close();}
async function go(pw){$('go').disabled=true;say('Checking…');
  try{const raw=pw?await derive(pw):hex(stored('tl_key'));await unlock(raw);if(pw)store('tl_key',toHex(raw));}
  catch(e){if(e.pw)store('tl_key',null);say(e.message,true);$('go').disabled=false;$('pw').focus();}}
$('f').addEventListener('submit',e=>{e.preventDefault();const pw=$('pw').value;if(pw)go(pw);});
if(stored('tl_key')){$('keep').checked=true;go(null);}
})();
</script>
</body>
</html>
