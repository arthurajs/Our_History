<!doctype html><html><head><meta charset="utf-8"><title>test</title><style>body{font-family:sans-serif;margin:20px}#yt{width:640px;height:360px;background:#000}#log{white-space:pre-wrap;font-size:13px}</style></head><body>
<button id="go">Play 2 segments</button> <button id="pause">Pause</button> <button id="resume">Resume</button>
<div id="wrap"><div id="yt"></div></div><div id="log"></div>
<script>
const log=m=>{document.getElementById('log').textContent+=new Date().toISOString().slice(11,19)+' '+m+'\n';};
let ytLoad=null;function loadYT(){if(ytLoad)return ytLoad;ytLoad=new Promise(res=>{if(window.YT&&YT.Player)return res(true);const t=setTimeout(()=>res(false),7000);window.onYouTubeIframeAPIReady=()=>{clearTimeout(t);res(true);};const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.onerror=()=>{clearTimeout(t);res(false);};document.head.append(sc);});return ytLoad;}
let player=null,pending=null,poll=null;
function ensurePlayer(){if(player)return Promise.resolve(true);return loadYT().then(ok=>{log('api '+ok);if(!ok)return false;player=new YT.Player(document.getElementById('yt'),{width:'100%',height:'100%',playerVars:{rel:0,modestbranding:1,playsinline:1,controls:1,origin:location.origin},events:{onStateChange:e=>player._onState&&player._onState(e),onError:e=>{log('error '+e.data);player._onError&&player._onError(e);}}});
 return new Promise(res=>{let n=0;const w=setInterval(()=>{if(player&&player.loadVideoById){clearInterval(w);res(true);}else if(++n>40){clearInterval(w);res(false);}},200);});});}
const segs=[{t0:30,t1:40},{t0:120,t1:128}];
function playSeg(k){const g=segs[k];if(!g){pending=null;log('all done');return;}const token=pending={};
 const onState=e=>{if(pending!==token)return;log('state '+e.data+' t='+(player.getCurrentTime&&player.getCurrentTime().toFixed(1)));if(e.data===YT.PlayerState.ENDED){clearInterval(poll);playSeg(k+1);}else if(e.data===YT.PlayerState.PLAYING){clearInterval(poll);poll=setInterval(()=>{const t=player.getCurrentTime();if(t>=g.t1-0.2){clearInterval(poll);player.pauseVideo();onState({data:YT.PlayerState.ENDED});}},300);}};
 player._onState=onState;player._onError=()=>{pending=null;log('fallback');};
 player.loadVideoById({videoId:'aqz-KE-bpKQ',startSeconds:g.t0,endSeconds:g.t1});}
document.getElementById('go').onclick=()=>{ensurePlayer().then(ok=>{log('player '+ok);if(ok)playSeg(0);});};
document.getElementById('pause').onclick=()=>player.pauseVideo();document.getElementById('resume').onclick=()=>player.playVideo();
</script></body></html>
